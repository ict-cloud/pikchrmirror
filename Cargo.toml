[package]
name = "PikchrMirror"
version = "0.2.0"
edition = "2021"

[dependencies]
log = "0.4.*"
pikchr = "0.1.*"
pretty_env_logger = "0.5.*"
rfd = "0.17.*"
xml-rs = "1.0.*"

[dependencies.tokio]
version = "1.50.*"
features = ["fs", "rt", "macros"]

[dependencies.resvg]
version = "0.47.*"

[dependencies.iced]
version = "0.14.*"
features = ["svg", "highlighter", "tokio"]

[dependencies.iced_wgpu]
version = "0.14.*"

[profile.release]
opt-level = "s" # or "z"
codegen-units = 1
lto = "thin" #alternatives "fat" or "false"
strip = "debuginfo"
