[package]
name = "PikchrMirror"
version = "0.2.2"
edition = "2021"

[dependencies]
log.workspace = true
pikchrmirror-core = { path = "../pikchrmirror-core" }
pretty_env_logger = "0.5.*"
rfd = "0.17.*"

[dependencies.tokio]
version = "1.53.*"
features = ["fs", "rt", "macros"]

[dependencies.iced]
version = "0.14.*"
features = ["svg", "highlighter", "tokio"]

[dependencies.iced_wgpu]
version = "0.14.*"

[dependencies.mistralrs]
version = "0.8.1"
optional = true

# Apple's Accelerate framework only exists on macOS; enabling it elsewhere
# fails the build ("library kind `framework` is only supported on Apple targets").
[target.'cfg(target_os = "macos")'.dependencies.mistralrs]
version = "0.8.1"
optional = true
features = ["accelerate"]

[build-dependencies.pikchrmirror-models]
path = "../pikchrmirror-models"
optional = true

[features]
# Chat assistant. The model is selected in /models.toml and downloaded at build
# time (set PIKCHR_MODEL=none to compile without downloading anything).
llm = ["dep:mistralrs", "dep:pikchrmirror-models"]
