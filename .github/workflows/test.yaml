name: Pikchr Tests

on:
  pull_request:
    branches:
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: "Cargo format"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out the repo"
        uses: actions/checkout@v4

      - uses: "dtolnay/rust-toolchain@stable"
        with:
          components: "rustfmt"

      - run: "cargo fmt --all -- --check"

  check:
    name: "Cargo check"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out the repo"
        uses: actions/checkout@v4

      - uses: "dtolnay/rust-toolchain@stable"

      - uses: "Swatinem/rust-cache@v2"
        with:
          shared-key: "test-yaml"

      - run: "cargo check"

  clippy:
    name: "Cargo clippy"
    needs: "check"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out the repo"
        uses: actions/checkout@v4

      - uses: "dtolnay/rust-toolchain@stable"
        with:
          components: "clippy"

      - uses: "Swatinem/rust-cache@v2"
        with:
          shared-key: "test-yaml"

      - run: "cargo clippy -- -D warnings"

  test:
    name: "Cargo test"
    needs: "check"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out the repo"
        uses: actions/checkout@v4

      - uses: "dtolnay/rust-toolchain@stable"

      - uses: "Swatinem/rust-cache@v2"
        with:
          shared-key: "test-yaml"

      - run: "cargo test"
