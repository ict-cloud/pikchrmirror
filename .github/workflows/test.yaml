name: Pikchr Tests

on:
  pull_request:
    branches:
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: "Cargo format"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out the repo"
        uses: actions/checkout@v4

      - uses: "dtolnay/rust-toolchain@stable"
        with:
          components: "rustfmt"

      - run: "cargo fmt --all -- --check"

  check:
    name: "Cargo check"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out the repo"
        uses: actions/checkout@v4

      - uses: "dtolnay/rust-toolchain@stable"

      - uses: "Swatinem/rust-cache@v2"
        with:
          shared-key: "test-yaml"

      - run: "cargo check --workspace"

  clippy:
    name: "Cargo clippy"
    needs: "check"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out the repo"
        uses: actions/checkout@v4

      - uses: "dtolnay/rust-toolchain@stable"
        with:
          components: "clippy"

      - uses: "Swatinem/rust-cache@v2"
        with:
          shared-key: "test-yaml"

      - run: "cargo clippy --workspace -- -D warnings"

  test:
    name: "Cargo test"
    needs: "check"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out the repo"
        uses: actions/checkout@v4

      - uses: "dtolnay/rust-toolchain@stable"

      - uses: "Swatinem/rust-cache@v2"
        with:
          shared-key: "test-yaml"

      - run: "cargo test --workspace"

  # The chat assistant is behind the `llm` feature. Compile and test it without
  # downloading weights so a broken feature build is caught here, not by users.
  llm:
    name: "Cargo test (llm feature)"
    needs: "check"
    runs-on: "ubuntu-latest"
    env:
      PIKCHR_MODEL: "none"
    steps:
      - name: "Check out the repo"
        uses: actions/checkout@v4

      - uses: "dtolnay/rust-toolchain@stable"
        with:
          components: "clippy"

      - uses: "Swatinem/rust-cache@v2"
        with:
          shared-key: "test-yaml-llm"

      - run: "cargo clippy -p PikchrMirror --all-targets --features llm -- -D warnings"

      - run: "cargo test -p PikchrMirror --features llm"
